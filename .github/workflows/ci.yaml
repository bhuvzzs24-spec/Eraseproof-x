name: distributed-backend
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -c requirements.lock -e '.[dev]'
      - run: ruff check . && ruff format --check .
      - run: pytest -m 'not integration' -v
  integration:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -c requirements.lock -e '.[dev]'
      - run: python scripts/configure_demo.py
      - run: sudo sysctl -w vm.max_map_count=262144
      - run: docker compose up --build -d --wait --wait-timeout 240
      - run: |
          set -a
          . ./.env
          set +a
          RUN_INTEGRATION=1 ERASEPROOF_TEST_FAULTS=1 pytest -m integration -v
      - run: |
          set -a
          . ./.env
          set +a
          ERASEPROOF_TEST_FAULTS=1 python scripts/verification_demo.py --inject-synthetic-fault --output work/reports/executable-demo.json
      - if: always()
        run: docker compose logs --no-color --tail 100
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-measurements
          path: |
            work/phase3-evaluation.json
            work/reports/*.json
          if-no-files-found: warn
      - if: always()
        run: docker compose down -v
