name: distributed-backend
permissions:
  contents: read
on: [push, pull_request]
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      runtime: ${{ steps.scope.outputs.runtime }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/ci_changes.py
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -c requirements.lock -c requirements-benchmark.lock -e '.[dev,benchmark]'
      - run: ruff check . && ruff format --check .
      - run: pytest -m 'not integration' -v
      - name: Validate curated measured datasets
        run: |
          for file in research/phase-4/results/*/dataset.json; do
            if test -f "$file"; then
              python -m eraseproof.research_report "$file" --output /tmp/validated-research --no-plots
            fi
          done
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: pip install -c requirements.lock -c requirements-benchmark.lock -e '.[dev,benchmark]'
      - run: npm ci
        working-directory: frontend
      - run: npm run format:check && npm run lint && npm run typecheck && npm test && npm run build
        working-directory: frontend
      - run: python scripts/configure_dashboard.py
      - run: python scripts/check_dashboard_bundle.py
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Real browser historical, role, failure-state and visual checks
        run: npm run test:e2e
        working-directory: frontend
      - if: always()
        run: python scripts/sanitize_test_artifacts.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-browser-local-data
          path: |
            frontend/test-results/**
            frontend/playwright-report/**
          if-no-files-found: warn
  integration:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    env:
      COMPOSE_PROJECT_NAME: eraseproof-research-ci
      COMPOSE_FILE: compose.yaml:compose.research.yaml
    timeout-minutes: 40
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -c requirements.lock -c requirements-benchmark.lock -e '.[dev,benchmark]'
      - run: python scripts/configure_demo.py
      - run: sudo sysctl -w vm.max_map_count=262144
      - run: docker compose up --build -d --wait --wait-timeout 240
      - run: |
          set -a
          . ./.env
          set +a
          RUN_INTEGRATION=1 ERASEPROOF_TEST_FAULTS=1 pytest -m integration -v
      - run: |
          set -a
          . ./.env
          set +a
          ERASEPROOF_TEST_FAULTS=1 python scripts/verification_demo.py --inject-synthetic-fault --output work/reports/executable-demo.json
      - name: Run seeded CI benchmark
        run: |
          set -a
          . ./.env
          set +a
          ERASEPROOF_RESEARCH_FAULTS=1 python -m eraseproof.research_runner --project eraseproof-research-ci --matrix research/phase-4/config/ci.v1.json --output work/phase4-ci
      - name: Validate measured data and generate figures
        if: always()
        run: |
          if test -f work/phase4-ci/dataset.json; then
            python -m eraseproof.research_report work/phase4-ci/dataset.json --output work/phase4-generated
          fi
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci && npm run build && npx playwright install --with-deps chromium
        working-directory: frontend
      - run: python scripts/configure_dashboard.py
      - run: python scripts/check_dashboard_bundle.py
      - name: Enforce operator credentials on source write APIs
        run: |
          set -a
          . ./.env
          . ./.dashboard.env
          set +a
          docker compose -f compose.yaml -f compose.research.yaml -f compose.dashboard.yaml up -d --wait --wait-timeout 120 customer order
      - name: Real browser Docker-backed deletion and isolated false-success journeys
        run: RUN_FULLSTACK=1 npm run test:e2e
        working-directory: frontend
      - if: always()
        run: python scripts/sanitize_test_artifacts.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-browser-fullstack
          path: |
            frontend/test-results/**
            frontend/playwright-report/**
            work/dashboard/jobs/**/status.json
            work/dashboard/jobs/**/results/**
          if-no-files-found: warn
      - if: always()
        run: docker compose logs --no-color --tail 100
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-measurements
          path: |
            work/phase3-evaluation.json
            work/reports/*.json
            work/phase4-ci/**
            work/phase4-generated/**
          if-no-files-found: warn
      - if: always()
        run: docker compose down -v
  security:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: pip install -c requirements.lock -e '.[dev]' && pip install pip-audit==2.10.1 bandit==1.8.6
      - name: Dependency and source security checks
        run: |
          mkdir -p work/security
          pip-audit -r requirements.lock --no-deps --disable-pip --format json --output work/security/python-audit.json
          pip-audit -r requirements-benchmark.lock --no-deps --disable-pip --format json --output work/security/python-benchmark-audit.json
          npm --prefix frontend ci
          npm --prefix frontend audit --audit-level=high --json > work/security/npm-audit.json
          bandit -r eraseproof scripts -f json -o work/security/bandit-all.json || test "$?" = 1
          bandit -r eraseproof scripts -lll -iii
      - name: Install pinned scanner and verify publisher checksum
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          mkdir -p /tmp/ep-trivy
          gh release download v0.76.2 --repo aquasecurity/trivy --pattern 'trivy_0.76.2_Linux-64bit.tar.gz' --pattern 'trivy_0.76.2_checksums.txt' --dir /tmp/ep-trivy
          cd /tmp/ep-trivy
          rg 'trivy_0.76.2_Linux-64bit.tar.gz$' trivy_0.76.2_checksums.txt | sha256sum --check
          tar -xzf trivy_0.76.2_Linux-64bit.tar.gz trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy
      - run: docker build -t eraseproof-runtime:ci . && docker build -f deploy/Dockerfile.gateway -t eraseproof-gateway:ci .
      - name: Actual container vulnerability inventory and fixed-critical gate
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          images=['eraseproof-runtime:ci','eraseproof-gateway:ci']+list(json.load(open('deploy/images.lock.json'))['images'].values())
          failed=[]
          for n,image in enumerate(images):
              path=f'work/security/image-{n}.json'
              subprocess.run(['trivy','image','--scanners','vuln','--format','json','--output',path,image],check=True,timeout=360)
              report=json.load(open(path))
              if any(v.get('Severity')=='CRITICAL' and v.get('FixedVersion') for r in report.get('Results',[]) for v in r.get('Vulnerabilities',[])):
                  failed.append(image)
          Path('work/security/image-index.json').write_text(json.dumps({'images':images,'gate':'fixed critical vulnerabilities; all other findings retained for review','failed':failed},indent=2))
          if failed: raise SystemExit('Fixed critical container vulnerabilities require remediation; inspect image artifacts')
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: phase6-security, path: 'work/security/**', if-no-files-found: warn}
  hosted:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: pip install -c requirements.lock -c requirements-benchmark.lock -e '.[dev,benchmark]'
      - name: Prepare isolated private credentials and local DNS
        run: |
          python scripts/validate_hosted.py --prepare
          sudo chown 10001:10001 work/hosted-ci/users.json
          echo '127.0.0.1 demo.example.invalid' | sudo tee -a /etc/hosts >/dev/null
          sudo sysctl -w vm.max_map_count=262144
          python scripts/hosted_ops.py validate --env-file work/hosted-ci/hosted.env --project eraseproof-hosted-ci --ci
      - name: Build and pull the actual hosted images
        run: |
          docker compose --env-file work/hosted-ci/hosted.env --project-name eraseproof-hosted-ci -f deploy/compose.hosted.yaml -f deploy/compose.ci.yaml --profile publish build
          docker compose --env-file work/hosted-ci/hosted.env --project-name eraseproof-hosted-ci -f deploy/compose.hosted.yaml -f deploy/compose.ci.yaml --profile publish pull --ignore-buildable
      - name: Start real hosted stack with loopback-only local HTTPS
        run: |
          python scripts/validate_hosted.py --start
          docker compose --env-file work/hosted-ci/hosted.env --project-name eraseproof-hosted-ci -f deploy/compose.hosted.yaml -f deploy/compose.ci.yaml cp caddy:/data/caddy/pki/authorities/local/root.crt work/hosted-ci/root.crt
      - name: Actual TLS, authorization, deletion, six-target verification, backup and restart qualification
        run: python scripts/validate_hosted.py --ca work/hosted-ci/root.crt
      - name: Measure the real list-query optimization without changing verification checks
        run: docker compose --env-file work/hosted-ci/hosted.env --project-name eraseproof-hosted-ci -f deploy/compose.hosted.yaml -f deploy/compose.ci.yaml exec -T customer python -m eraseproof.read_model_benchmark > work/phase6-read-model-performance.json
      - run: npm ci && npx playwright install --with-deps chromium && npm run test:hosted
        working-directory: frontend
      - if: always()
        run: python scripts/sanitize_test_artifacts.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase6-hosted-validation
          path: |
            work/phase6-hosted-validation.json
            work/phase6-backup.json
            work/phase6-restore.json
            work/phase6-read-model-performance.json
            work/hosted-ci/startup.json
            frontend/test-results-hosted/**
          if-no-files-found: warn
      - if: always()
        run: docker compose --env-file work/hosted-ci/hosted.env --project-name eraseproof-hosted-ci -f deploy/compose.hosted.yaml -f deploy/compose.ci.yaml --profile publish logs --no-color --tail 60
      - if: always()
        run: docker compose --env-file work/hosted-ci/hosted.env --project-name eraseproof-hosted-ci -f deploy/compose.hosted.yaml -f deploy/compose.ci.yaml --profile publish down -v
