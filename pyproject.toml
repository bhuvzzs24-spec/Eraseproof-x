[project]
name = "eraseproof-x"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi==0.115.12", "uvicorn==0.34.2", "psycopg[binary]==3.2.9", "pika==1.3.2", "redis==6.1.0", "httpx==0.28.1"]
[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff==0.11.10", "PyYAML==6.0.2"]
[tool.ruff]
line-length = 100
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires real Docker infrastructure"]
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[tool.setuptools]
packages = ["eraseproof"]
