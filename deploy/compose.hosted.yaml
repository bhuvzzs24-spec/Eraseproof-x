name: eraseproof-hosted
services:
  postgres:
    image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set password}
      POSTGRES_DB: eraseproof
    volumes:
    - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U lab -d eraseproof
      interval: 5s
      retries: 20
    networks:
    - private
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    restart: unless-stopped
    mem_limit: 768m
    command:
    - postgres
    - -c
    - max_connections=100
    - -c
    - shared_buffers=128MB
    - -c
    - log_statement=none
  redis:
    image: redis:7.4-alpine@sha256:c5d34a98396a4775e223c74e929162c35c5a2182901ba26b50ade939941ce14b
    volumes:
    - redis-data:/data
    - ./redis-entrypoint.sh:/run/redis-entrypoint.sh:ro
    healthcheck:
      test:
      - CMD-SHELL
      - REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG
      interval: 5s
      retries: 20
    networks:
    - private
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    restart: unless-stopped
    mem_limit: 256m
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?configure Redis password}
      VERIFIER_REDIS_PASSWORD: ${VERIFIER_REDIS_PASSWORD:?configure read identity}
    entrypoint:
    - /bin/sh
    - /run/redis-entrypoint.sh
  rabbitmq:
    image: rabbitmq:4.1-alpine@sha256:425307007e5a54b20fe6b6da718c2e385999eddda28d44d329b7e7bfabe45610
    environment:
      RABBITMQ_DEFAULT_USER: lab
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set password}
    volumes:
    - rabbit-data:/var/lib/rabbitmq
    - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test:
      - CMD
      - rabbitmq-diagnostics
      - -q
      - ping
      interval: 10s
      retries: 20
    networks:
    - private
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    restart: unless-stopped
    mem_limit: 512m
  opensearch:
    image: opensearchproject/opensearch:2.19.7@sha256:3bfa1ec74d56928c2e018033d45c460ce2c0ea65a5cedd577de3102326c31b89
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: 'true'
      DISABLE_INSTALL_DEMO_CONFIG: 'true'
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
    - search-data:/usr/share/opensearch/data
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=3s'
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
    - search-private
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    restart: unless-stopped
    mem_limit: 1536m
  migrate:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${MIGRATOR_DATABASE_URL:?configure owner-only migration URL}
      BROKER_URL: amqp://lab:${RABBITMQ_PASSWORD:?set broker password}@rabbitmq:5672/%2F
      REDIS_URL: ${REDIS_URL:?configure authenticated Redis URL}
      SEARCH_URL: http://opensearch:9200
      INSPECTION_TOKEN: ${INSPECTION_TOKEN:?set inspection token}
      APP_ENV: demo
      DELETION_TOKEN: ${DELETION_TOKEN:?set separate deletion token of at least 24
        characters}
      DELETION_RETRY_BASE_SECONDS: '1'
      DELETION_LEASE_SECONDS: '30'
      DEPLOYMENT_MODE: hosted
      OPERATOR_TOKEN: ${OPERATOR_TOKEN:?configure operator credential}
      VERIFICATION_TOKEN: ${VERIFICATION_TOKEN:?configure verification credential}
      DASHBOARD_ENABLE_RESEARCH: '0'
      ERASEPROOF_RESEARCH_FAULTS: '0'
      ENABLE_TEST_FAULTS: '0'
    command:
    - python
    - -m
    - eraseproof.db
    depends_on:
      postgres:
        condition: service_healthy
    networks:
    - private
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    mem_limit: 160m
    pids_limit: 128
  provision-verification:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${MIGRATOR_DATABASE_URL:?configure owner-only migration URL}
      BROKER_URL: amqp://lab:${RABBITMQ_PASSWORD:?set broker password}@rabbitmq:5672/%2F
      REDIS_URL: ${REDIS_URL:?configure authenticated Redis URL}
      SEARCH_URL: http://opensearch:9200
      INSPECTION_TOKEN: ${INSPECTION_TOKEN:?set inspection token}
      APP_ENV: demo
      DELETION_TOKEN: ${DELETION_TOKEN:?set separate deletion token of at least 24
        characters}
      DELETION_RETRY_BASE_SECONDS: '1'
      DELETION_LEASE_SECONDS: '30'
      DEPLOYMENT_MODE: hosted
      OPERATOR_TOKEN: ${OPERATOR_TOKEN:?configure operator credential}
      VERIFICATION_TOKEN: ${VERIFICATION_TOKEN:?configure verification credential}
      DASHBOARD_ENABLE_RESEARCH: '0'
      ERASEPROOF_RESEARCH_FAULTS: '0'
      ENABLE_TEST_FAULTS: '0'
      VERIFIER_DB_PASSWORD: ${VERIFIER_DB_PASSWORD:?configure}
      VERIFIER_CONTROL_PASSWORD: ${VERIFIER_CONTROL_PASSWORD:?configure}
      VERIFIER_REDIS_PASSWORD: ${VERIFIER_REDIS_PASSWORD:?configure}
      RUNTIME_DB_PASSWORD: ${RUNTIME_DB_PASSWORD:?configure non-owner password}
    command:
    - python
    - -m
    - eraseproof.provision_hosted
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
    - private
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    mem_limit: 160m
    pids_limit: 128
  verification:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${VERIFIER_CONTROL_DATABASE_URL:?configure coordinator URL}
      BROKER_URL: amqp://lab:${RABBITMQ_PASSWORD:?set broker password}@rabbitmq:5672/%2F
      REDIS_URL: ${REDIS_URL:?configure authenticated Redis URL}
      SEARCH_URL: http://opensearch:9200
      INSPECTION_TOKEN: ${INSPECTION_TOKEN:?set inspection token}
      APP_ENV: demo
      DELETION_TOKEN: ${DELETION_TOKEN:?set separate deletion token of at least 24
        characters}
      DELETION_RETRY_BASE_SECONDS: '1'
      DELETION_LEASE_SECONDS: '30'
      DEPLOYMENT_MODE: hosted
      OPERATOR_TOKEN: ${OPERATOR_TOKEN:?configure operator credential}
      VERIFICATION_TOKEN: ${VERIFICATION_TOKEN:?configure verification credential}
      DASHBOARD_ENABLE_RESEARCH: '0'
      ERASEPROOF_RESEARCH_FAULTS: '0'
      ENABLE_TEST_FAULTS: '0'
      SERVICE: verification
      VERIFIER_READ_DATABASE_URL: ${VERIFIER_READ_DATABASE_URL:?configure probe URL}
      VERIFIER_REDIS_URL: ${VERIFIER_REDIS_URL:?configure Redis read credential}
      VERIFIER_SEARCH_URL: ${VERIFIER_SEARCH_URL:?configure authenticated read-only
        search URL}
      RESEARCH_TOKEN: ${RESEARCH_TOKEN:?configure read-only research credential}
    depends_on: &id001
      provision-verification:
        condition: service_completed_successfully
      search-reader:
        condition: service_healthy
    healthcheck: &id003
      test:
      - CMD
      - python
      - -c
      - import urllib.request,os; urllib.request.urlopen('http://localhost:'+os.getenv('PORT','8000')+'/health/ready',timeout=5)
      interval: 10s
      timeout: 8s
      retries: 12
    networks:
    - private
    - api
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    mem_limit: 160m
    pids_limit: 128
  verification-scheduler:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${VERIFIER_CONTROL_DATABASE_URL:?configure coordinator URL}
      BROKER_URL: amqp://lab:${RABBITMQ_PASSWORD:?set broker password}@rabbitmq:5672/%2F
